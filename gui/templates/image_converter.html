<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Converter - DeckGen</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/common.js" defer></script>
  <script src="/static/js/image_converter.js" defer></script>
</head>
<body>
  $navbar
  <div id="loading-overlay" class="overlay">
    <div class="progress-box">
      <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar-fill"></div></div>
      <div id="progress-status">Processing...</div>
    </div>
  </div>
  <main class="tool-page">
    <div class="panel">
      <div class="panel-head">
        <h1>Image Converter</h1>
      </div>
      <div class="field-header">
        <label for="export-dir">Export directory (target)</label>
        <button type="button" class="btn-clear-field" data-target="export-dir" title="Clear directory">✕ Clear</button>
      </div>
      <input type="text" id="export-dir" placeholder="/home/choroy/don-corleone">
      <div class="field-header">
        <label for="image-input">Images to convert (PNG/JPG)</label>
        <button type="button" class="btn-clear-field" data-target="image-input" title="Clear selected images">✕ Clear</button>
      </div>
      <input type="file" id="image-input" accept=".png,.jpg,.jpeg,image/png,image/jpeg" multiple>
      <button type="button" id="convert-btn">Convert images to standard PDF</button>
      <div id="convert-result"></div>
      <div id="error-message" class="error"></div>
    </div>
  </main>
</body>
</html>
