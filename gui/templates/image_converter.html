<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Converter - DeckGen</title>
  <link rel="stylesheet" href="/static/css/main.css?v=4">
  <script src="/static/js/common.js?v=4" defer></script>
  <script src="/static/js/image_converter.js?v=4" defer></script>
</head>
<body>
  $navbar
  <div id="loading-overlay" class="overlay">
    <div class="progress-box">
      <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar-fill"></div></div>
      <div id="progress-status">Processing...</div>
    </div>
  </div>
  <main class="tool-page ps-ui">
    <div class="panel ps-panel">
      <div class="panel-head">
        <h1>Image Converter</h1>
      </div>
      <div class="ps-section">
        <div class="ps-row-between">
          <label class="ps-label" for="export-dir" style="margin: 0;">Export directory (target)</label>
          <button type="button" class="ps-mini-btn btn-clear-field" data-target="export-dir" title="Clear directory">✕ Clear</button>
        </div>
        <input type="text" id="export-dir" class="ps-input" placeholder="/home/choroy/don-corleone" style="margin-top: 4px;">
      </div>
      <div class="ps-section">
        <div class="ps-row-between">
          <label class="ps-label" for="image-input" style="margin: 0;">Images to convert (PNG/JPG)</label>
          <button type="button" class="ps-mini-btn btn-clear-field" data-target="image-input" title="Clear selected images">✕ Clear</button>
        </div>
        <input type="file" id="image-input" class="ps-file-input" accept=".png,.jpg,.jpeg,image/png,image/jpeg" multiple style="margin-top: 4px;">
        <button type="button" id="convert-btn" class="ps-btn ps-btn-primary" style="width: 100%; margin-top: 10px;">Convert images to standard PDF</button>
      </div>
      <div id="convert-result" class="cb-status-msg"></div>
      <div id="error-message" class="error"></div>
    </div>
  </main>
</body>
</html>
