<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DeckGen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"></noscript>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/common.js" defer></script>
</head>
<body>
  $navbar
  <main class="landing">
    <div class="landing-hero-banner">
      <img class="landing-hero-banner-img" src="/static/images/landing-banner.svg" alt="DeckGen banner">
      <div class="landing-hero-banner-overlay">
        <h1>DeckGen</h1>
        <p>Another tool for creating your proxy decks</p>
      </div>
    </div>
    <div class="cards-grid">
      <a class="landing-card" href="/card-builder">
        <span class="landing-icon"><img src="/static/images/card-builder.svg" alt="Card Builder"></span>
        <h2>Card Builder</h2>
        <p>Build and edit individual cards before exporting them.</p>
      </a>
      <a class="landing-card" href="/deck-generator">
        <span class="landing-icon"><img src="/static/images/deck-generator.svg" alt="Deck Generator"></span>
        <h2>Deck Generator</h2>
        <p>Generate print sheets, verify decks and assign card backs.</p>
      </a>
      <a class="landing-card" href="/image-converter">
        <span class="landing-icon"><img src="/static/images/image-converter.svg" alt="Image Converter"></span>
        <h2>Image Converter</h2>
        <p>Convert PNG and JPG images into standard PDF files.</p>
      </a>
    </div>
  </main>
</body>
</html>
